<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-adsense-account" content="ca-pub-3518959293552717">
  <title>Thirdtype Links</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08101d;
      --panel: rgba(15, 23, 42, 0.92);
      --panel-2: rgba(22, 33, 52, 0.92);
      --line: rgba(148, 163, 184, 0.2);
      --text: #eef5ff;
      --muted: #aab8cc;
      --accent: #7dd3fc;
      --accent-2: #49d19a;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "SUIT", "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(125, 211, 252, 0.18), transparent 28rem),
        radial-gradient(circle at 88% 8%, rgba(73, 209, 154, 0.15), transparent 24rem),
        linear-gradient(150deg, #08101d 0%, #111a2b 44%, #17243a 100%);
    }

    main {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .hero,
    .section {
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015)),
        var(--panel);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 28px;
      margin-bottom: 18px;
    }

    .eyebrow {
      display: inline-flex;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(125, 211, 252, 0.14);
      color: #d8f2ff;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: -0.06em;
    }

    .section {
      padding: 24px;
      margin-top: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015)),
        var(--panel-2);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.2rem;
      letter-spacing: -0.03em;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(8, 16, 29, 0.46);
    }

    .item strong {
      font-size: 1rem;
      letter-spacing: -0.03em;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
    }

    a.button,
    a.text-link {
      text-decoration: none;
      font-weight: 700;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      color: #07111e;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    a.text-link {
      color: #d8f2ff;
    }

    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1040px);
        padding-top: 16px;
      }

      .hero,
      .section {
        padding: 18px;
        border-radius: 22px;
      }

      .item {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>슬기로운 생활</h1>
    </section>

    <section class="section">
      <h2>Google Play</h2>
      <div class="list">
        <article class="item">
          <strong>오늘내일모레</strong>
          <div class="link-row">
            <a class="text-link" href="https://play.google.com/store/apps/details?id=com.thirdtype.ttcal">Google Play</a>
          </div>
        </article>
        <article class="item">
          <strong>주식 매도신호등</strong>
          <div class="link-row">
            <a class="text-link" href="https://play.google.com/store/apps/details?id=com.maedo.signal">Google Play</a>
          </div>
        </article>
        <article class="item">
          <strong>Retro Timestamp</strong>
          <div class="link-row">
            <a class="text-link" href="https://play.google.com/store/apps/details?id=com.thirdtype.retrotimestamp">Google Play</a>
          </div>
        </article>
      </div>
    </section>

    <section class="section">
      <h2>개인정보처리방침</h2>
      <div class="list">
        <article class="item">
          <strong>오늘내일모레</strong>
          <div class="link-row">
            <a class="text-link" href="/ttcal/privacy-policy.html">/ttcal/privacy-policy.html</a>
          </div>
        </article>
        <article class="item">
          <strong>주식 매도신호등</strong>
          <div class="link-row">
            <a class="text-link" href="/privacy-policy.html">/privacy-policy.html</a>
          </div>
        </article>
        <article class="item">
          <strong>Retro Timestamp</strong>
          <div class="link-row">
            <a class="text-link" href="https://gist.githubusercontent.com/thirdtype-dev/ecb0b9655ab0c8f83f1e45f2513bde0d/raw/aee1f98ba7e94214c64815c03deef1d17da5b88e/privacy-policy.html">privacy-policy.html</a>
          </div>
        </article>
      </div>
    </section>

    <footer>Thirdtype Public Links</footer>
  </main>
</body>
</html>
