<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-adsense-account" content="ca-pub-3518959293552717">
  <title>슬기로운 생활</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --paper: #ffffff;
      --ink: #17181c;
      --muted: #5b6270;
      --line: #e4e7ee;
      --accent: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(860px, calc(100% - 32px));
      margin: 40px auto;
      padding: 42px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 18px 48px rgba(17, 24, 39, 0.08);
    }

    h1,
    h2 {
      margin: 0;
      line-height: 1.25;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 22px;
      margin-top: 32px;
      margin-bottom: 14px;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfcff;
      flex-wrap: wrap;
    }

    .item strong {
      font-size: 16px;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .footnote {
      margin-top: 28px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 860px);
        margin: 10px auto;
        padding: 26px 20px;
        border-radius: 14px;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 20px;
      }

      .item {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>슬기로운 생활</h1>

    <h2>Google Play</h2>
    <section class="list">
      <article class="item">
        <strong>오늘내일모레</strong>
        <a href="https://play.google.com/store/apps/details?id=com.thirdtype.ttcal">Google Play</a>
      </article>
      <article class="item">
        <strong>주식 매도신호등</strong>
        <a href="https://play.google.com/store/apps/details?id=com.maedo.signal">Google Play</a>
      </article>
      <article class="item">
        <strong>Retro Timestamp</strong>
        <a href="https://play.google.com/store/apps/details?id=com.thirdtype.retrotimestamp">Google Play</a>
      </article>
    </section>

    <h2>개인정보처리방침</h2>
    <section class="list">
      <article class="item">
        <strong>주식 매도신호등</strong>
        <a href="/privacy-policy/maedo-signal.html">/privacy-policy/maedo-signal.html</a>
      </article>
      <article class="item">
        <strong>Retro Timestamp</strong>
        <a href="/privacy-policy/retro-timestamp.html">/privacy-policy/retro-timestamp.html</a>
      </article>
    </section>

    <p class="footnote">
      광고 소유 인증 파일은 규격상 루트의 <a href="/app-ads.txt">/app-ads.txt</a>와 <a href="/ads.txt">/ads.txt</a>에 평문으로 유지됩니다.
    </p>
  </main>
</body>
</html>
