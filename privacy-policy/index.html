<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개인정보처리방침</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --paper: #ffffff;
      --ink: #17181c;
      --muted: #5b6270;
      --line: #e4e7ee;
      --accent: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(860px, calc(100% - 32px));
      margin: 40px auto;
      padding: 42px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 18px 48px rgba(17, 24, 39, 0.08);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 34px;
      line-height: 1.25;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfcff;
      flex-wrap: wrap;
    }

    .item strong {
      font-size: 16px;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>개인정보처리방침</h1>
    <section class="list">
      <article class="item">
        <strong>오늘내일모레</strong>
        <a href="/privacy-policy/ttcal.html">/privacy-policy/ttcal.html</a>
      </article>
      <article class="item">
        <strong>주식 매도신호등</strong>
        <a href="/privacy-policy/maedo-signal.html">/privacy-policy/maedo-signal.html</a>
      </article>
      <article class="item">
        <strong>Retro Timestamp</strong>
        <a href="/privacy-policy/retro-timestamp.html">/privacy-policy/retro-timestamp.html</a>
      </article>
    </section>
  </main>
</body>
</html>
