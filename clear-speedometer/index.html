<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A clear GPS speedometer for the road</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --muted: #5b6472;
      --line: #e5e7eb;
      --paper: #ffffff;
      --accent: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8fafc;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(32px, 7vw, 64px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, .08);
      text-align: center;
    }
    h1 { margin: 0 0 24px; font-size: clamp(30px, 6vw, 48px); line-height: 1.12; letter-spacing: -.03em; }
    p { margin: 0 auto 32px; max-width: 530px; color: var(--muted); font-size: 18px; line-height: 1.65; }
    a {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #1e293b; }
  </style>
</head>
<body>
  <main>
    <h1>A clear GPS speedometer for the road</h1>
    <p>When the road demands your attention, your speed should be readable at a glance. GPS Speed gives drivers, riders, and cyclists a clear GPS-based speed view on Android.</p>
    <a href="https://play.google.com/store/apps/details?id=com.thirdtype.gpsspeed&amp;referrer=utm_source%3Dgithub_pages%26utm_medium%3Downed%26utm_campaign%3Dp526_20260804%26utm_content%3Dclear_speedometer">Get GPS Speed on Google Play</a>
  </main>
  <script>
    (() => {
      const key = 'p526-counter-incremented';
      try {
        if (!sessionStorage.getItem(key)) {
          sessionStorage.setItem(key, '1');
          fetch('https://api.counterapi.dev/v1/thirdtype-p526/p526-ghpages-gpsspeed-20260804/up', { mode: 'no-cors', keepalive: true }).catch(() => {});
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
