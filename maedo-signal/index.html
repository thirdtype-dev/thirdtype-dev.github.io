<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주식 매도신호등 개발자 정보</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --paper: #ffffff;
      --ink: #17181c;
      --muted: #5b6270;
      --line: #e4e7ee;
      --accent: #111827;
      --soft: #eef2ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(860px, calc(100% - 32px));
      margin: 40px auto;
      padding: 42px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 18px 48px rgba(17, 24, 39, 0.08);
    }

    h1, h2 { line-height: 1.25; margin: 0; }
    h1 { font-size: 34px; margin-bottom: 10px; }
    h2 { font-size: 22px; margin-top: 34px; margin-bottom: 12px; }
    p { margin: 10px 0; }

    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    .meta { color: var(--muted); font-size: 15px; }

    ul { margin: 10px 0 0 22px; padding: 0; }
    li { margin: 6px 0; }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 860px);
        margin: 10px auto;
        padding: 26px 20px;
        border-radius: 14px;
      }

      h1 { font-size: 28px; }
      h2 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Maedo Signal</span>
    <h1>주식 매도신호등</h1>
    <p class="meta">시장 위험 신호를 신호등 색상으로 요약하는 Android 앱</p>

    <h2>링크</h2>
    <ul>
      <li><a href="./privacy-policy.html">개인정보처리방침</a></li>
      <li><a href="https://play.google.com/store/apps/details?id=com.maedo.signal">Google Play 스토어</a></li>
      <li><a href="/report/index.html">공개 페이지</a></li>
    </ul>
  </main>
</body>
</html>
